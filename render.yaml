# Render Blueprint: one free web service from the Dockerfile. Free instances sleep after 15 idle
# minutes and wake in about a minute; see docs/deploy.md. Secrets (sync: false) are typed into the
# Render dashboard once and never live in this file.
services:
  - type: web
    name: chess-coach
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: ENGINE_THREADS
        value: "1"
      - key: ENGINE_HASH_MB
        value: "32"
      - key: ENGINE_PROCESSES
        value: "1"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_URL  # the service's https address (https://<name>.onrender.com), used in password-reset links
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
